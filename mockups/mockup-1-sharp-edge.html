<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 1 — Sharp Edge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      padding: 40px 20px;
    }

    .page-title {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 6px;
    }
    .design-name {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 40px;
    }
    .design-name span { color: #ff6b57; }

    /* Three states laid out side by side on desktop, stacked on mobile */
    .states {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .states { grid-template-columns: 1fr; }
    }

    .state-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555;
      text-align: center;
      margin-bottom: 14px;
    }

    /* The app frame — simulates a phone/card */
    .app {
      background: #000;
      border: 1px solid #222;
      padding: 36px 28px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      align-self: flex-start;
    }

    /* Search row */
    .search-row {
      display: flex;
      width: 100%;
      gap: 0;
    }
    .search-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-right: none;
      color: #fff;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
    }
    .search-input::placeholder { color: #555; }
    .search-btn {
      background: #ff6b57;
      color: #000;
      border: none;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 20px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    /* Loading */
    .loading {
      font-size: 14px;
      color: #555;
      letter-spacing: 1px;
    }

    /* Weather card */
    .weather-card {
      width: 100%;
      background: #1a1a1a;
      padding: 24px 20px;
      border: 1px solid #2a2a2a;
    }
    .weather-emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
    }
    .weather-city {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }
    .weather-country {
      font-size: 12px;
      color: #555;
      margin-bottom: 14px;
    }
    .weather-temp {
      font-size: 52px;
      font-weight: 800;
      color: #ff6b57;
      line-height: 1;
      margin-bottom: 8px;
    }
    .weather-desc {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 18px;
    }
    .weather-stats {
      display: flex;
      gap: 20px;
    }
    .stat {
      font-size: 13px;
      color: #777;
    }
    .stat span {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #444;
      margin-bottom: 2px;
    }

    /* Error message */
    .error-msg {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-left: 3px solid #ff6b57;
      padding: 18px 16px;
    }
    .error-msg p {
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }
    .error-msg strong { color: #fff; }
  </style>
</head>
<body>

  <p class="page-title">Design Mockup 1 of 3</p>
  <h1 class="design-name"><span>Sharp</span> Edge</h1>

  <div class="states">

    <!-- STATE 1: Before searching -->
    <div>
      <p class="state-label">Before Searching</p>
      <div class="app">
        <div class="app-title">Weather App</div>
        <div class="search-row">
          <input class="search-input" type="text" placeholder="Enter a city…" disabled>
          <button class="search-btn">Search</button>
        </div>
      </div>
    </div>

    <!-- STATE 2: Weather result -->
    <div>
      <p class="state-label">Weather Result</p>
      <div class="app">
        <div class="app-title">Weather App</div>
        <div class="search-row">
          <input class="search-input" type="text" value="Barcelona" disabled>
          <button class="search-btn">Search</button>
        </div>
        <div class="weather-card">
          <span class="weather-emoji">⛅</span>
          <div class="weather-city">Barcelona</div>
          <div class="weather-country">Spain</div>
          <div class="weather-temp">24°C</div>
          <div class="weather-desc">Partly cloudy</div>
          <div class="weather-stats">
            <div class="stat"><span>Humidity</span>68%</div>
            <div class="stat"><span>Wind</span>14 km/h NW</div>
          </div>
        </div>
      </div>
    </div>

    <!-- STATE 3: City not found -->
    <div>
      <p class="state-label">City Not Found</p>
      <div class="app">
        <div class="app-title">Weather App</div>
        <div class="search-row">
          <input class="search-input" type="text" value="Londan" disabled>
          <button class="search-btn">Search</button>
        </div>
        <div class="error-msg">
          <p><strong>We couldn't find that city.</strong><br>Please check the spelling and try again.</p>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
